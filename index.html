<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F0">
<title>Ciclo: finanças para quem é CLT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#F2F4F0; --papel:#FFFFFF; --tinta:#1B2A32; --muted:#5F6D66; --linha:#D5DBD3;
  --verde:#1F7A4D; --vermelho:#B3261E; --ambar:#A86F08; --azul:#2B59C3;
  --r:8px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fundo);color:var(--tinta);font:400 16px/1.5 Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;line-height:1.15;margin:0;letter-spacing:-.01em}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:720px;margin:0 auto;padding:0 20px calc(110px + env(safe-area-inset-bottom))}
.wrap.estreito{max-width:440px;padding-bottom:40px}
.topo{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 0 8px}
.marca{font:700 22px 'Bricolage Grotesque',sans-serif;text-decoration:none;letter-spacing:-.02em}
.engrenagem{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--muted)}
.engrenagem.on{color:var(--tinta);background:#E4E9E2}
.titulo{font-size:30px;font-weight:700;margin:16px 0 4px}
.sub{color:var(--muted);margin:0 0 20px;max-width:56ch}
.sec{padding:28px 0 8px;border-top:1px solid var(--linha);margin-top:24px}
.sec h2{font-size:20px;font-weight:700;margin-bottom:12px}
.muted{color:var(--muted)}
.carregando{color:var(--muted);padding:40px 0}

/* abas inferiores */
.abas{position:fixed;left:0;right:0;bottom:0;background:var(--papel);border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.abas .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;margin:0 auto}
.abas a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none}
.abas a.on{color:var(--tinta);font-weight:600}
.abas a.on svg{stroke-width:2.4}
.abas a.destaque span.ic{display:grid;place-items:center;width:44px;height:44px;margin-top:-18px;border-radius:50%;background:var(--tinta);color:#fff;border:4px solid var(--fundo)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* painel */
.manchete{border-left:4px solid var(--verde);padding-left:16px;margin:12px 0 0}
.manchete.risco{border-color:var(--vermelho)}
.manchete h1{font-size:clamp(26px,5.6vw,38px);font-weight:700;letter-spacing:-.02em}
.manchete p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.grafico{width:100%;height:auto;display:block;touch-action:pan-y;margin-top:22px}
.grafico text{font:500 11px Figtree,sans-serif;fill:var(--muted)}
.grafico .zero{stroke:var(--tinta);stroke-width:1;stroke-dasharray:3 4;opacity:.45}
.grafico .pag{stroke:var(--linha);stroke-width:1}
.leitura{min-height:26px;margin:6px 0 0;font-weight:500}
.par{display:grid;grid-template-columns:1fr auto;gap:10px 16px;margin:0}
.par dt{color:var(--muted)}
.par dd{margin:0;text-align:right;font-weight:600}
.pos{color:var(--verde)} .neg{color:var(--vermelho)}
.barra{height:8px;background:#E1E7DF;border-radius:4px;overflow:hidden;margin-top:6px}
.barra>i{display:block;height:100%;background:var(--verde)}
.barra.aviso>i{background:var(--ambar)}
.barra.estouro>i{background:var(--vermelho)}
.lista{list-style:none;margin:0;padding:0}
.lista>li{padding:12px 0;border-bottom:1px solid var(--linha)}
.lista>li:last-child{border-bottom:0}
.cat-topo{display:flex;justify-content:space-between;gap:12px}
.alerta{border-left:4px solid var(--ambar);padding:2px 0 2px 12px}
.alerta.critico{border-color:var(--vermelho)}
.alerta strong{display:block}
.score{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.score b{font:700 44px 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em}
.vazio{padding:20px 0;color:var(--muted)}
.vazio .btn{margin-top:12px}

/* formulários */
.form{display:grid;gap:16px;margin-top:12px}
.form label{display:grid;gap:6px;font-weight:500}
.form input:not([type=radio]),.form select{width:100%;min-height:48px;padding:0 12px;border:1px solid #BCC5BB;border-radius:var(--r);background:var(--papel)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--tinta);border-radius:var(--r);overflow:hidden;padding:0;margin:0}
.seg input{position:absolute;opacity:0}
.seg label{display:block;text-align:center;padding:12px 0;font-weight:600;cursor:pointer}
.seg input:checked+label{background:var(--tinta);color:#fff}
.seg input:focus-visible+label{outline:2px solid var(--azul);outline-offset:-4px}
.btn{min-height:48px;padding:0 20px;border:1px solid var(--tinta);border-radius:var(--r);background:var(--tinta);color:#fff;font-weight:600;cursor:pointer}
.btn.sec2{background:transparent;color:var(--tinta)}
.btn.mini{min-height:36px;padding:0 12px;font-size:14px}
.btn.perigo{background:transparent;color:var(--vermelho);border-color:var(--vermelho)}
.btn:disabled{opacity:.5}
.link{background:none;border:0;padding:8px 0;text-decoration:underline;cursor:pointer;color:var(--tinta)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--linha);background:var(--papel);border-radius:999px;min-height:36px;padding:0 14px;cursor:pointer;font-size:14px;font-weight:500}
details.novo{margin-top:16px;border-top:1px solid var(--linha);padding-top:8px}
details.novo>summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.erro-msg{color:var(--vermelho);min-height:22px;margin:0}

/* extrato e listas com ações */
.linha{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.linha .meta{display:block;color:var(--muted);font-size:14px}
.linha .val{font-weight:600;white-space:nowrap}
.x{width:36px;height:36px;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;border-radius:50%}
.acoes{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.nav-ciclo{display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px}
.nav-ciclo button{width:44px;height:44px;border-radius:50%;border:1px solid var(--linha);background:var(--papel);cursor:pointer;font-size:18px}
.nav-ciclo button:disabled{opacity:.35}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:var(--r);max-width:90vw;opacity:0;pointer-events:none;z-index:9}
#toast.on{opacity:1}
#toast.erro{background:var(--vermelho)}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';

/* =====================================================================
   CONFIGURAÇÃO: cole aqui os dados do seu projeto Supabase
   (Project Settings > API). Use a chave "anon public", nunca a service_role.
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://lxqbvailsupnazitnalj.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_XYPTGoykcHl2Vl5mSU7BXw_9NoI98hL',
  APP_NAME: 'Ciclo'
};

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const BRL0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const brl = v => BRL.format(Number(v || 0));
const brl0 = v => BRL0.format(Number(v || 0));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const hojeDate = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const hoje = () => iso(hojeDate());
const addDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const diaNoMes = (a, m, d) => new Date(a, m - 1, Math.min(d, new Date(a, m, 0).getDate()));
const addMeses = (d, n) => diaNoMes(d.getFullYear(), d.getMonth() + 1 + n, d.getDate());
const fmtData = s => { const [, m, d] = s.split('-'); return `${d}/${m}`; };
const fmtDataLonga = s => { const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const diffDias = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const GRUPOS = { essencial: 'Essenciais', estilo_vida: 'Estilo de vida', divida: 'Dívidas', investimento: 'Investimentos' };
const FORMAS = { pix: 'Pix', debito: 'Débito', credito: 'Crédito', dinheiro: 'Dinheiro', boleto: 'Boleto', recorrente: 'Conta fixa', outro: 'Outro' };

function parseValor(s) {
  s = String(s || '').replace(/[R$\s]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : NaN;
}

// Mesmo cálculo da função ciclo_em do banco.
function cicloEm(data, dia) {
  const a = data.getFullYear(), m = data.getMonth() + 1;
  const este = diaNoMes(a, m, dia);
  if (data >= este) {
    const prox = diaNoMes(m === 12 ? a + 1 : a, m === 12 ? 1 : m + 1, dia);
    return { ini: este, fim: addDias(prox, -1) };
  }
  const ant = diaNoMes(m === 1 ? a - 1 : a, m === 1 ? 12 : m - 1, dia);
  return { ini: ant, fim: addDias(este, -1) };
}

let tt;
function toast(msg, erro) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'on' + (erro ? ' erro' : '');
  clearTimeout(tt);
  tt = setTimeout(() => { t.className = ''; }, 3400);
}

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
async function db(q) {
  const { data, error } = await q;
  if (error) { toast(error.message, true); throw error; }
  return data;
}

const state = { user: null, perfil: null, cats: null, off: 0 };
const $app = $('#app');

const IC = {
  painel: '<path d="M4 20V10M10 20V5M16 20v-7M22 20H2"/>',
  extrato: '<path d="M5 6h14M5 12h14M5 18h9"/>',
  lancar: '<path d="M12 5v14M5 12h14"/>',
  fixos: '<path d="M4 12a8 8 0 0 1 13.5-5.8L20 8M20 4v4h-4M20 12a8 8 0 0 1-13.5 5.8L4 16M4 20v-4h4"/>',
  metas: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
  ajustes: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- dados compartilhados ---------- */
async function carregarPerfil() {
  let { data, error } = await sb.from('perfis').select('*').maybeSingle();
  if (error) throw error;
  if (!data) {
    await db(sb.rpc('iniciar_conta'));
    ({ data, error } = await sb.from('perfis').select('*').maybeSingle());
    if (error) throw error;
  }
  state.perfil = data;
}
async function garantirCats() {
  if (!state.cats) {
    state.cats = await db(sb.from('categorias').select('*').order('tipo', { ascending: false }).order('nome'));
  }
}
function optCats(tipo, sel) {
  const lista = state.cats.filter(c => c.tipo === tipo);
  const op = c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.nome)}</option>`;
  if (tipo === 'receita') return lista.map(op).join('');
  return Object.entries(GRUPOS).map(([g, rot]) => {
    const itens = lista.filter(c => c.grupo === g);
    return itens.length ? `<optgroup label="${rot}">${itens.map(op).join('')}</optgroup>` : '';
  }).join('');
}
const catPorNome = (tipo, nome) => state.cats.find(c => c.tipo === tipo && c.nome === nome);

/* ---------- estrutura da página ---------- */
function shell(rota) {
  const abas = [['painel', 'Painel'], ['extrato', 'Extrato'], ['lancar', 'Lançar'], ['fixos', 'Fixos'], ['metas', 'Metas']];
  $app.innerHTML = `
    <div class="wrap">
      <header class="topo">
        <a class="marca" href="#painel">${esc(CONFIG.APP_NAME)}</a>
        <a class="engrenagem ${rota === 'ajustes' ? 'on' : ''}" href="#ajustes" aria-label="Ajustes">${icon('ajustes')}</a>
      </header>
      <main id="view"></main>
    </div>
    <nav class="abas" aria-label="Principal"><div class="in">
      ${abas.map(([r, rot]) => `<a href="#${r}" class="${r === rota ? 'on' : ''} ${r === 'lancar' ? 'destaque' : ''}" ${r === rota ? 'aria-current="page"' : ''}>
        <span class="ic">${icon(r)}</span><span>${rot}</span></a>`).join('')}
    </div></nav>`;
  return $('#view');
}

/* ---------- login ---------- */
function telaLogin() {
  let modo = 'entrar';
  const desenhar = () => {
    $app.innerHTML = `
      <div class="wrap estreito">
        <header class="topo"><span class="marca">${esc(CONFIG.APP_NAME)}</span></header>
        <h1 class="titulo">${modo === 'entrar' ? 'Entre na sua conta' : 'Crie sua conta'}</h1>
        <p class="sub">Anote o que entra e o que sai. O app organiza seu mês pelo dia do pagamento e avisa quando o dinheiro não vai chegar.</p>
        <form id="fl" class="form">
          <label>E-mail <input id="email" type="email" autocomplete="email" required></label>
          <label>Senha <input id="senha" type="password" minlength="6" autocomplete="${modo === 'entrar' ? 'current-password' : 'new-password'}" required></label>
          <p class="erro-msg" id="msg" role="alert"></p>
          <button class="btn" id="ok">${modo === 'entrar' ? 'Entrar' : 'Criar conta'}</button>
          <button type="button" class="link" id="troca">${modo === 'entrar' ? 'Ainda não tenho conta' : 'Já tenho conta'}</button>
        </form>
      </div>`;
    $('#troca').onclick = () => { modo = modo === 'entrar' ? 'criar' : 'entrar'; desenhar(); };
    $('#fl').onsubmit = async e => {
      e.preventDefault();
      const email = $('#email').value.trim(), senha = $('#senha').value;
      $('#ok').disabled = true; $('#msg').textContent = '';
      const r = modo === 'entrar'
        ? await sb.auth.signInWithPassword({ email, password: senha })
        : await sb.auth.signUp({ email, password: senha, options: { emailRedirectTo: location.origin + location.pathname } });
      $('#ok').disabled = false;
      if (r.error) { $('#msg').textContent = r.error.message.includes('Invalid login') ? 'E-mail ou senha incorretos.' : r.error.message; return; }
      if (modo === 'criar' && !r.data.session) {
        $('#msg').style.color = 'var(--verde)';
        $('#msg').textContent = 'Conta criada. Abra o e-mail de confirmação e depois entre aqui.';
      }
    };
  };
  desenhar();
}

/* ---------- primeiro acesso ---------- */
function telaOnboarding() {
  $app.innerHTML = `
    <div class="wrap estreito">
      <header class="topo"><span class="marca">${esc(CONFIG.APP_NAME)}</span></header>
      <h1 class="titulo">Vamos configurar seu ciclo</h1>
      <p class="sub">Com quatro respostas o painel já projeta seu mês. Você muda tudo depois em Ajustes.</p>
      <form id="fo" class="form">
        <label>Dia em que o salário cai <input id="dia" type="number" min="1" max="31" value="5" required></label>
        <label>Quanto você tem em conta hoje <input id="saldo" inputmode="decimal" placeholder="0,00" required></label>
        <label>Salário líquido mensal <input id="sal" inputmode="decimal" placeholder="O valor que cai na conta"></label>
        <label>Reserva de emergência guardada <input id="res" inputmode="decimal" placeholder="0,00"></label>
        <button class="btn">Começar</button>
      </form>
    </div>`;
  $('#fo').onsubmit = async e => {
    e.preventDefault();
    const dia = parseInt($('#dia').value, 10);
    const saldo = parseValor($('#saldo').value);
    const sal = $('#sal').value ? parseValor($('#sal').value) : 0;
    const res = $('#res').value ? parseValor($('#res').value) : 0;
    if ([saldo, sal, res].some(Number.isNaN) || !(dia >= 1 && dia <= 31)) return toast('Confira os valores digitados.', true);
    await db(sb.from('perfis').update({ dia_pagamento: dia, saldo_inicial: saldo, saldo_inicial_data: hoje(), reserva_atual: res, onboarding_ok: true }).eq('user_id', state.user.id));
    if (sal > 0) {
      await garantirCats();
      await db(sb.from('recorrencias').insert({
        tipo: 'receita', descricao: 'Salário', valor: sal, categoria_id: catPorNome('receita', 'Salário')?.id ?? null,
        frequencia: 'mensal', dia_do_mes: dia, inicio: hoje()
      }));
    }
    state.perfil = null;
    if (location.hash !== '#painel') location.hash = 'painel'; else route();
  };
}

/* ---------- painel ---------- */
function grafico(rows, paydays) {
  const W = 640, H = 230, pl = 8, pr = 8, pt = 24, pb = 26;
  const vals = rows.map(r => Number(r.saldo_proj));
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi === lo) hi = lo + 1;
  const folga = (hi - lo) * 0.08; lo -= folga; hi += folga;
  const n = rows.length;
  const x = i => pl + (W - pl - pr) * i / (n - 1);
  const y = v => pt + (H - pt - pb) * (hi - v) / (hi - lo);
  const y0 = y(0);
  const pts = rows.map((r, i) => `${x(i).toFixed(1)} ${y(Number(r.saldo_proj)).toFixed(1)}`);
  const linha = 'M' + pts.join('L');
  const area = `${linha}L${x(n - 1).toFixed(1)} ${y0.toFixed(1)}L${x(0).toFixed(1)} ${y0.toFixed(1)}Z`;
  const marcas = paydays.map(d => {
    const i = rows.findIndex(r => r.dia_ref === d);
    return i < 0 ? '' : `<line class="pag" x1="${x(i)}" x2="${x(i)}" y1="${pt - 6}" y2="${H - pb}"/><text x="${x(i) + 4}" y="${pt - 9}">pagamento ${fmtData(d)}</text>`;
  }).join('');
  const rot = i => `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${fmtData(rows[i].dia_ref)}</text>`;
  return `
    <svg class="grafico" id="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Projeção do saldo nos próximos ${n - 1} dias">
      <defs>
        <clipPath id="cp"><rect x="0" y="0" width="${W}" height="${y0}"/></clipPath>
        <clipPath id="cn"><rect x="0" y="${y0}" width="${W}" height="${H - y0}"/></clipPath>
      </defs>
      <path d="${area}" fill="#1F7A4D" fill-opacity=".14" clip-path="url(#cp)"/>
      <path d="${area}" fill="#B3261E" fill-opacity=".2" clip-path="url(#cn)"/>
      ${marcas}
      <line class="zero" x1="${pl}" x2="${W - pr}" y1="${y0}" y2="${y0}"/>
      <path d="${linha}" fill="none" stroke="#2B59C3" stroke-width="2.4" stroke-linejoin="round"/>
      <circle id="ponto" r="5" fill="#2B59C3" stroke="#fff" stroke-width="2" cx="${x(0)}" cy="${y(vals[0])}"/>
      ${rot(0)}${rot(Math.floor((n - 1) / 2))}${rot(n - 1)}
    </svg>
    <p class="leitura" id="leitura" aria-live="off">Hoje: ${brl(vals[0])}</p>`;
}

function ligarGrafico(el, rows) {
  const svg = $('#grafico', el);
  if (!svg) return;
  const W = 640, H = 230, pl = 8, pr = 8, pt = 24, pb = 26, n = rows.length;
  const vals = rows.map(r => Number(r.saldo_proj));
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi === lo) hi = lo + 1;
  const folga = (hi - lo) * 0.08; lo -= folga; hi += folga;
  const mover = ev => {
    const b = svg.getBoundingClientRect();
    const px = (ev.clientX - b.left) / b.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - pl) / (W - pl - pr) * (n - 1))));
    const r = rows[i];
    $('#ponto', el).setAttribute('cx', pl + (W - pl - pr) * i / (n - 1));
    $('#ponto', el).setAttribute('cy', pt + (H - pt - pb) * (hi - vals[i]) / (hi - lo));
    const extra = i === 0 ? 'hoje' : `entra ${brl0(r.entradas)}, sai ${brl0(Number(r.saidas_fixas) + Number(r.saidas_variaveis))}`;
    $('#leitura', el).textContent = `${fmtData(r.dia_ref)}: ${brl(vals[i])} (${extra})`;
  };
  svg.addEventListener('pointermove', mover);
  svg.addEventListener('pointerdown', mover);
}

async function vPainel(el) {
  el.innerHTML = '<p class="carregando">Calculando seu ciclo…</p>';
  await sb.rpc('materializar_recorrencias');
  const [p, proj] = await Promise.all([db(sb.rpc('painel')), db(sb.rpc('projecao_saldo', { p_dias: 60 }))]);
  if (p.sem_perfil) { state.perfil = null; return route(); }

  if (!p.tem_dados) {
    el.innerHTML = `
      <h1 class="titulo">Seu painel</h1>
      <div class="vazio">
        <p>Ainda não há nada para projetar. Comece pelo que cai e sai todo mês: salário, aluguel, mensalidades. Depois lance os gastos do dia a dia.</p>
        <div class="acoes"><a class="btn" href="#fixos" style="display:inline-grid;place-items:center;text-decoration:none">Cadastrar contas fixas</a>
        <a class="btn sec2" href="#lancar" style="display:inline-grid;place-items:center;text-decoration:none">Lançar um gasto</a></div>
      </div>`;
    return;
  }

  // Manchete: responde "vou chegar ao dia do pagamento?"
  const prox = p.proximo_pagamento;
  const antes = proj.filter(r => r.dia_ref < prox);
  const negCiclo = antes.find(r => Number(r.saldo_proj) < 0);
  const saldoFim = antes.length ? Number(antes[antes.length - 1].saldo_proj) : Number(p.saldo_hoje);
  let risco = false, manchete, sub;
  if (Number(p.saldo_hoje) < 0) {
    risco = true;
    manchete = `Seu saldo está negativo em ${brl0(Math.abs(p.saldo_hoje))}.`;
    sub = `O próximo pagamento é em ${fmtData(prox)}.`;
  } else if (negCiclo) {
    risco = true;
    const d = diffDias(negCiclo.dia_ref, prox);
    manchete = `Seu dinheiro acaba em ${fmtData(negCiclo.dia_ref)}, ${d} ${d === 1 ? 'dia' : 'dias'} antes do pagamento.`;
    sub = `Faltam cerca de ${brl0(Math.abs(Math.min(...antes.map(r => Number(r.saldo_proj)))))} para fechar o ciclo no azul.`;
  } else {
    manchete = `Você chega ao pagamento de ${fmtData(prox)} com cerca de ${brl0(saldoFim)}.`;
    sub = `Faltam ${p.dias_restantes} ${p.dias_restantes === 1 ? 'dia' : 'dias'} para o próximo pagamento.`;
  }
  const mediaVar = Number(proj[1]?.saidas_variaveis || 0);
  const nota = mediaVar > 0
    ? `A projeção usa suas contas fixas, parcelas e um gasto médio de ${brl(mediaVar)} por dia.`
    : 'A projeção usa suas contas fixas e parcelas. Lance gastos do dia a dia para ela ficar mais realista.';

  // dias de pagamento dentro do gráfico
  const dp = state.perfil.dia_pagamento, pd = [];
  for (let k = 0; k < 3; k++) { const b = addMeses(parseISO(prox), k); pd.push(iso(diaNoMes(b.getFullYear(), b.getMonth() + 1, dp))); }

  const sobra = Number(p.sobra);
  const cats = (p.categorias || []).slice(0, 8);
  const rotScore = p.score >= 75 ? 'Saudável' : p.score >= 50 ? 'Em construção' : p.score >= 25 ? 'Pede atenção' : 'Crítico';

  el.innerHTML = `
    <div class="manchete ${risco ? 'risco' : ''}"><h1>${esc(manchete)}</h1><p>${esc(sub)}</p></div>
    ${grafico(proj, pd)}
    <p class="muted" style="margin:4px 0 0;font-size:14px">${esc(nota)}</p>

    ${p.alertas.length ? `<section class="sec"><h2>Alertas</h2><ul class="lista">
      ${p.alertas.map(a => `<li><div class="alerta ${a.nivel}"><strong>${esc(a.titulo)}</strong>${esc(a.texto)}</div></li>`).join('')}</ul></section>` : ''}

    <section class="sec">
      <h2>Ciclo de ${fmtData(p.ciclo_inicio)} a ${fmtData(iso(addDias(parseISO(p.proximo_pagamento), -1)))}</h2>
      <dl class="par">
        <dt>Saldo hoje</dt><dd class="${Number(p.saldo_hoje) < 0 ? 'neg' : ''}">${brl(p.saldo_hoje)}</dd>
        <dt>Entrou</dt><dd>${brl(p.receitas)}</dd>
        <dt>Saiu</dt><dd>${brl(p.despesas)}</dd>
        ${Number(p.investido) > 0 ? `<dt>Investido</dt><dd>${brl(p.investido)}</dd>` : ''}
        <dt>${sobra >= 0 ? 'Sobrou' : 'Faltou'}</dt><dd class="${sobra >= 0 ? 'pos' : 'neg'}">${brl(Math.abs(sobra))}</dd>
        <dt>Parte da renda que você guardou</dt><dd>${p.taxa_poupanca == null ? 'sem renda no ciclo' : Number(p.taxa_poupanca).toFixed(0).replace('.', ',') + '%'}</dd>
      </dl>
    </section>

    <section class="sec">
      <h2>Gastos por categoria</h2>
      ${cats.length ? `<ul class="lista">${cats.map(c => {
        const pct = c.pct == null ? null : Number(c.pct);
        const cls = pct == null ? '' : pct >= 100 ? 'estouro' : pct >= 80 ? 'aviso' : '';
        return `<li><div class="cat-topo"><span>${esc(c.nome)}</span><span>${brl0(c.gasto)}${Number(c.orcamento) > 0 ? ` de ${brl0(c.orcamento)}` : ''}</span></div>
          ${pct == null ? '' : `<div class="barra ${cls}"><i style="width:${Math.min(100, pct)}%"></i></div>`}</li>`;
      }).join('')}</ul>` : '<p class="vazio">Nenhum gasto neste ciclo ainda.</p>'}
      ${cats.some(c => Number(c.orcamento) > 0) ? '' : '<p class="muted">Defina limites por categoria em <a href="#ajustes">Ajustes</a> para receber avisos antes de estourar.</p>'}
    </section>

    ${p.insights.length ? `<section class="sec"><h2>O que mudou nos seus gastos</h2><ul class="lista">
      ${p.insights.map(i => `<li>Você gastou ${Number(i.variacao_pct)}% a mais em ${esc(i.nome)} que a sua média: ${brl0(i.atual)} nos últimos 30 dias contra ${brl0(i.media)} por mês antes.</li>`).join('')}</ul></section>` : ''}

    <section class="sec">
      <h2>Saúde financeira</h2>
      <div class="score"><b>${p.score}</b><span>de 100 · ${rotScore}</span></div>
      <div class="barra ${p.score < 25 ? 'estouro' : p.score < 50 ? 'aviso' : ''}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p.score}" aria-label="Score de saúde financeira"><i style="width:${p.score}%"></i></div>
      <dl class="par" style="margin-top:16px">
        <dt>Reserva de emergência</dt><dd>${p.meses_reserva == null ? 'sem dados' : String(p.meses_reserva).replace('.', ',') + ' meses'}</dd>
        <dt>Renda dos próximos 90 dias já comprometida</dt><dd>${p.comprometimento_pct == null ? 'sem dados' : Number(p.comprometimento_pct).toFixed(0) + '%'}</dd>
        <dt>Menor saldo previsto em 90 dias</dt><dd class="${Number(p.saldo_minimo_90d) < 0 ? 'neg' : ''}">${brl0(p.saldo_minimo_90d)}</dd>
      </dl>
      <p class="muted" style="font-size:14px">O score soma poupança (40 pontos), reserva de 6 meses (30), baixo comprometimento da renda (20) e ausência de saldo negativo (10).</p>
    </section>`;
  ligarGrafico(el, proj);
}

/* ---------- lançar ---------- */
async function vLancar(el) {
  await garantirCats();
  const recentes = await db(sb.from('transacoes').select('descricao,categoria_id,tipo,forma_pagamento').order('criado_em', { ascending: false }).limit(300));
  const memoria = new Map();
  recentes.forEach(r => { const k = (r.descricao || '').toLowerCase().replace(/ \(\d+\/\d+\)$/, ''); if (k && !memoria.has(k)) memoria.set(k, r); });

  el.innerHTML = `
    <h1 class="titulo">Lançar</h1>
    <p class="sub">Dois toques para registrar. Repetiu uma descrição? A categoria vem preenchida.</p>
    <form id="fl" class="form">
      <fieldset class="seg"><legend class="sr">Tipo</legend>
        <input type="radio" name="tipo" id="t-d" value="despesa" checked><label for="t-d">Gasto</label>
        <input type="radio" name="tipo" id="t-r" value="receita"><label for="t-r">Ganho</label>
      </fieldset>
      <label><span id="rot-valor">Valor</span> <input id="valor" inputmode="decimal" autocomplete="off" placeholder="0,00" required></label>
      <label>Descrição <input id="desc" autocomplete="off" list="sug" placeholder="Ex.: mercado, farmácia, freela"></label>
      <datalist id="sug">${[...new Set([...memoria.values()].map(r => r.descricao.replace(/ \(\d+\/\d+\)$/, '')))].slice(0, 40).map(d => `<option value="${esc(d)}">`).join('')}</datalist>
      <label>Categoria <select id="cat"></select></label>
      <div class="dupla">
        <label>Data <input type="date" id="data" value="${hoje()}" required></label>
        <label>Pagamento <select id="forma">${Object.entries(FORMAS).filter(([k]) => k !== 'recorrente').map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
      </div>
      <label id="lb-parc" hidden>Número de parcelas <input type="number" id="parc" min="1" max="48" value="1"></label>
      <button class="btn" id="salvar">Salvar lançamento</button>
    </form>`;

  const tipoAtual = () => $('input[name=tipo]:checked', el).value;
  const refazerCats = (sel) => { $('#cat', el).innerHTML = `<option value="">Sem categoria</option>${optCats(tipoAtual(), sel)}`; };
  const ajustar = () => {
    const parcelavel = tipoAtual() === 'despesa' && $('#forma', el).value === 'credito';
    $('#lb-parc', el).hidden = !parcelavel;
    const n = parcelavel ? parseInt($('#parc', el).value, 10) || 1 : 1;
    $('#rot-valor', el).textContent = n > 1 ? 'Valor de cada parcela' : 'Valor';
  };
  refazerCats();
  $$('input[name=tipo]', el).forEach(r => r.addEventListener('change', () => { refazerCats(); ajustar(); }));
  $('#forma', el).addEventListener('change', ajustar);
  $('#parc', el).addEventListener('input', ajustar);
  $('#desc', el).addEventListener('input', e => {
    const m = memoria.get(e.target.value.trim().toLowerCase());
    if (!m) return;
    if (m.tipo !== tipoAtual()) { $(`input[name=tipo][value=${m.tipo}]`, el).checked = true; refazerCats(); }
    if (m.categoria_id) $('#cat', el).value = m.categoria_id;
    if (m.forma_pagamento && m.forma_pagamento !== 'recorrente') { $('#forma', el).value = m.forma_pagamento; ajustar(); }
  });

  $('#fl', el).onsubmit = async e => {
    e.preventDefault();
    const tipo = tipoAtual();
    const valor = parseValor($('#valor', el).value);
    if (!(valor > 0)) return toast('Informe um valor maior que zero.', true);
    const forma = $('#forma', el).value;
    const n = (tipo === 'despesa' && forma === 'credito') ? Math.max(1, parseInt($('#parc', el).value, 10) || 1) : 1;
    const base = parseISO($('#data', el).value);
    const catId = $('#cat', el).value || null;
    const catNome = state.cats.find(c => c.id === catId)?.nome;
    const desc = $('#desc', el).value.trim() || catNome || (tipo === 'despesa' ? 'Gasto' : 'Ganho');
    const grupo = n > 1 ? crypto.randomUUID() : null;
    const linhas = Array.from({ length: n }, (_, i) => ({
      tipo, valor, descricao: n > 1 ? `${desc} (${i + 1}/${n})` : desc, data: iso(addMeses(base, i)),
      categoria_id: catId, forma_pagamento: forma,
      parcela_n: n > 1 ? i + 1 : null, parcela_total: n > 1 ? n : null, grupo_parcela: grupo
    }));
    $('#salvar', el).disabled = true;
    try {
      await db(sb.from('transacoes').insert(linhas));
      toast(tipo === 'despesa' ? (n > 1 ? `Gasto salvo em ${n} parcelas.` : 'Gasto salvo.') : 'Ganho salvo.');
      $('#valor', el).value = ''; $('#desc', el).value = ''; $('#parc', el).value = 1; ajustar();
      $('#valor', el).focus();
    } finally { $('#salvar', el).disabled = false; }
  };
}

/* ---------- extrato ---------- */
async function vExtrato(el) {
  const dia = state.perfil.dia_pagamento;
  let c = cicloEm(hojeDate(), dia);
  for (let i = 0; i > state.off; i--) c = cicloEm(addDias(c.ini, -1), dia);
  for (let i = 0; i < state.off; i++) c = cicloEm(addDias(c.fim, 1), dia);
  const rows = await db(sb.from('transacoes')
    .select('id,tipo,descricao,valor,data,forma_pagamento,recorrencia_id,categorias(nome)')
    .gte('data', iso(c.ini)).lte('data', iso(c.fim))
    .order('data', { ascending: false }).order('criado_em', { ascending: false }));
  const ent = rows.filter(r => r.tipo === 'receita').reduce((s, r) => s + Number(r.valor), 0);
  const sai = rows.filter(r => r.tipo === 'despesa').reduce((s, r) => s + Number(r.valor), 0);
  const h = hoje();

  el.innerHTML = `
    <h1 class="titulo">Extrato</h1>
    <div class="nav-ciclo">
      <button id="ant" aria-label="Ciclo anterior">‹</button>
      <strong>${fmtData(iso(c.ini))} a ${fmtData(iso(c.fim))}${state.off === 0 ? ' (atual)' : ''}</strong>
      <button id="prox" aria-label="Próximo ciclo" ${state.off >= 1 ? 'disabled' : ''}>›</button>
    </div>
    <dl class="par" style="margin:12px 0 8px"><dt>Entrou</dt><dd class="pos">${brl(ent)}</dd><dt>Saiu</dt><dd>${brl(sai)}</dd></dl>
    ${rows.length ? `<ul class="lista">${rows.map(r => `
      <li class="linha">
        <div><strong>${esc(r.descricao || (r.tipo === 'receita' ? 'Ganho' : 'Gasto'))}</strong>
          <span class="meta">${esc(r.categorias?.nome || 'Sem categoria')} · ${FORMAS[r.forma_pagamento] || ''} · ${fmtData(r.data)}${r.data > h ? ' · agendado' : ''}</span></div>
        <span class="val ${r.tipo === 'receita' ? 'pos' : ''}">${r.tipo === 'receita' ? '+' : '−'}${brl(r.valor)}</span>
        <button class="x" data-id="${r.id}" data-rec="${r.recorrencia_id ? 1 : 0}" aria-label="Excluir lançamento">×</button>
      </li>`).join('')}</ul>` : '<p class="vazio">Nenhum lançamento neste ciclo.</p>'}`;

  $('#ant', el).onclick = () => { state.off--; route(); };
  $('#prox', el).onclick = () => { state.off++; route(); };
  $$('.x', el).forEach(b => b.onclick = async () => {
    const aviso = b.dataset.rec === '1'
      ? 'Excluir este lançamento? Ele vem de uma conta fixa e volta a aparecer. Para parar de vez, pause a conta em Fixos.'
      : 'Excluir este lançamento?';
    if (!confirm(aviso)) return;
    await db(sb.from('transacoes').delete().eq('id', b.dataset.id));
    toast('Lançamento excluído.');
    route();
  });
}

  $$('[data-a]', el).forEach(b => b.onclick = async () => {
    if (b.dataset.a === 'pausa') {
      await db(sb.from('recorrencias').update({ ativo: b.dataset.ativo !== 'true' }).eq('id', b.dataset.id));
    } else {
      if (!confirm('Excluir esta conta fixa? Os lançamentos que ela já gerou continuam no extrato.')) return;
      await db(sb.from('recorrencias').delete().eq('id', b.dataset.id));
    }
    route();
  });
}

    <p class="sub">Defina o valor e o prazo. O app calcula quanto guardar a cada pagamento.</p>
    ${metas.length ? `<ul class="lista">${metas.map(m => {
      const falta = Math.max(0, Number(m.valor_alvo) - Number(m.valor_atual));
      const pct = Math.min(100, Number(m.valor_atual) / Number(m.valor_alvo) * 100);
      const ciclos = Math.max(1, Math.ceil(diffDias(h, m.prazo) / 30.4));
      const atrasada = m.prazo < h && falta > 0;
      return `<li>
        <div class="cat-topo"><strong>${esc(m.nome)}</strong><span>${brl0(m.valor_atual)} de ${brl0(m.valor_alvo)}</span></div>
        <div class="barra"><i style="width:${pct}%"></i></div>
        <p class="muted" style="margin:6px 0 0">${falta === 0 ? 'Meta batida.' : atrasada ? `Prazo de ${fmtDataLonga(m.prazo)} vencido. Faltam ${brl0(falta)}.` : `Até ${fmtDataLonga(m.prazo)}: guarde ${brl0(falta / ciclos)} a cada pagamento (${ciclos} ${ciclos === 1 ? 'ciclo' : 'ciclos'}).`}</p>
        <div class="acoes">
          <button class="btn sec2 mini" data-a="add" data-id="${m.id}" data-v="${m.valor_atual}">Adicionar valor</button>
          <button class="btn perigo mini" data-a="del" data-id="${m.id}">Excluir</button>
        </div></li>`;
    }).join('')}</ul>` : '<p class="vazio">Nenhuma meta ainda. Que tal a viagem, a reserva ou a entrada do carro?</p>'}

    <details class="novo" ${metas.length ? '' : 'open'}>
      <summary>Criar meta</summary>
      <form id="fm" class="form">
        <label>Nome da meta <input id="mnome" required placeholder="Ex.: reserva de emergência"></label>
        <div class="dupla">
          <label>Valor alvo <input id="malvo" inputmode="decimal" required placeholder="0,00"></label>
          <label>Já guardado <input id="matual" inputmode="decimal" placeholder="0,00"></label>
        </div>
        <label>Prazo <input id="mprazo" type="date" min="${h}" required></label>
        <button class="btn">Criar meta</button>
      </form>
    </details>`;

  $('#fm', el).onsubmit = async e => {
    e.preventDefault();
    const alvo = parseValor($('#malvo', el).value);
    const atual = $('#matual', el).value ? parseValor($('#matual', el).value) : 0;
    if (!(alvo > 0) || Number.isNaN(atual) || atual < 0) return toast('Confira os valores digitados.', true);
    await db(sb.from('metas').insert({ nome: $('#mnome', el).value.trim(), valor_alvo: alvo, valor_atual: atual, prazo: $('#mprazo', el).value }));
    toast('Meta criada.');
    route();
  };
  $$('[data-a]', el).forEach(b => b.onclick = async () => {
    if (b.dataset.a === 'add') {
      const v = parseValor(prompt('Quanto você guardou agora?') || '');
      if (!(v > 0)) return;
      await db(sb.from('metas').update({ valor_atual: Number(b.dataset.v) + v }).eq('id', b.dataset.id));
      toast('Valor adicionado.');
    } else {
      if (!confirm('Excluir esta meta?')) return;
      await db(sb.from('metas').delete().eq('id', b.dataset.id));
    }
    route();
  });
}

/* ---------- ajustes ---------- */
async function vAjustes(el) {
  await garantirCats();
  const p = state.perfil;
  const saldo = Number(await db(sb.rpc('saldo_ate', { p_data: hoje() })) || 0);
  const despesas = state.cats.filter(c => c.tipo === 'despesa' && c.grupo !== 'investimento');

  el.innerHTML = `
    <h1 class="titulo">Ajustes</h1>
    <section class="sec" style="border-top:0;margin-top:8px">
      <h2>Ciclo e saldo</h2>
      <form id="fa" class="form">
        <label>Dia em que o salário cai <input id="adia" type="number" min="1" max="31" value="${p.dia_pagamento}" required></label>
        <label>Saldo em conta hoje <input id="asaldo" inputmode="decimal" value="${saldo.toFixed(2).replace('.', ',')}" required></label>
        <label>Reserva de emergência <input id="ares" inputmode="decimal" value="${Number(p.reserva_atual).toFixed(2).replace('.', ',')}" required></label>
        <button class="btn">Salvar ajustes</button>
      </form>
    </section>

    <section class="sec">
      <h2>Limite por categoria</h2>
      <p class="muted" style="margin-top:-4px">Quanto você quer gastar por ciclo. Deixe 0 para não ter limite.</p>
      <ul class="lista">${despesas.map(c => `
        <li class="linha" style="grid-template-columns:1fr 130px">
          <label for="o-${c.id}"><strong>${esc(c.nome)}</strong><span class="meta">${GRUPOS[c.grupo]}</span></label>
          <input id="o-${c.id}" class="lim" data-id="${c.id}" inputmode="decimal" value="${Number(c.orcamento_ciclo) ? Number(c.orcamento_ciclo).toFixed(2).replace('.', ',') : '0'}" style="min-height:44px;padding:0 10px;border:1px solid #BCC5BB;border-radius:8px;text-align:right;width:100%">
        </li>`).join('')}</ul>
      <details class="novo"><summary>Nova categoria</summary>
        <form id="fc" class="form">
          <fieldset class="seg"><legend class="sr">Tipo</legend>
            <input type="radio" name="ctipo" id="c-d" value="despesa" checked><label for="c-d">Gasto</label>
            <input type="radio" name="ctipo" id="c-r" value="receita"><label for="c-r">Ganho</label>
          </fieldset>
          <label>Nome <input id="cnome" required></label>
          <label id="lb-grupo">Grupo <select id="cgrupo">${Object.entries(GRUPOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
          <button class="btn">Criar categoria</button>
        </form>
      </details>
    </section>

    <section class="sec">
      <h2>Conta</h2>
      <p class="muted">${esc(state.user.email)}</p>
      <button class="btn sec2" id="sair">Sair</button>
    </section>`;

  $('#fa', el).onsubmit = async e => {
    e.preventDefault();
    const dia = parseInt($('#adia', el).value, 10);
    const novo = parseValor($('#asaldo', el).value), res = parseValor($('#ares', el).value);
    if (Number.isNaN(novo) || Number.isNaN(res) || !(dia >= 1 && dia <= 31)) return toast('Confira os valores digitados.', true);
    // Ajusta o saldo inicial para que o saldo de hoje fique igual ao informado.
    await db(sb.from('perfis').update({ dia_pagamento: dia, saldo_inicial: Number(p.saldo_inicial) + (novo - saldo), reserva_atual: res }).eq('user_id', state.user.id));
    state.perfil = null;
    toast('Ajustes salvos.');
    route();
  };
  $$('.lim', el).forEach(i => i.onchange = async () => {
    const v = parseValor(i.value || '0');
    if (Number.isNaN(v) || v < 0) return toast('Informe um valor válido.', true);
    await db(sb.from('categorias').update({ orcamento_ciclo: v }).eq('id', i.dataset.id));
    state.cats = null;
    toast('Limite salvo.');
  });
  $$('input[name=ctipo]', el).forEach(r => r.addEventListener('change', () => {
    $('#lb-grupo', el).hidden = $('input[name=ctipo]:checked', el).value === 'receita';
  }));
  $('#fc', el).onsubmit = async e => {
    e.preventDefault();
    const tipo = $('input[name=ctipo]:checked', el).value;
    await db(sb.from('categorias').insert({ tipo, nome: $('#cnome', el).value.trim(), grupo: tipo === 'despesa' ? $('#cgrupo', el).value : null }));
    state.cats = null;
    toast('Categoria criada.');
    route();
  };
  $('#sair', el).onclick = () => sb.auth.signOut();
}

/* ---------- rotas ---------- */
const TELAS = { painel: vPainel, lancar: vLancar, extrato: vExtrato, fixos: vFixos, metas: vMetas, ajustes: vAjustes };
let rotaSeq = 0;

async function route() {
  const seq = ++rotaSeq;
  try {
    if (!state.user) return telaLogin();
    if (!state.perfil) await carregarPerfil();
    if (seq !== rotaSeq) return;
    if (!state.perfil.onboarding_ok) return telaOnboarding();
    let rota = (location.hash || '#painel').slice(1);
    if (!TELAS[rota]) rota = 'painel';
    if (rota !== 'extrato') state.off = 0;
    const el = shell(rota);
    await TELAS[rota](el);
    if (seq === rotaSeq) window.scrollTo(0, 0);
  } catch (err) {
    console.error(err);
    if (seq === rotaSeq && state.user) {
      const v = $('#view') || $app;
      v.innerHTML = `<div class="vazio"><p>Não foi possível carregar esta tela. ${esc(err.message || '')}</p><button class="btn" onclick="route()">Tentar de novo</button></div>`;
    }
  }
}

(async function iniciar() {
  if (CONFIG.SUPABASE_URL.startsWith('COLE')) {
    $app.innerHTML = '<div class="wrap estreito"><h1 class="titulo">Falta configurar</h1><p class="sub">Abra o arquivo index.html e preencha SUPABASE_URL e SUPABASE_ANON_KEY no começo do script.</p></div>';
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  state.user = session?.user ?? null;
  sb.auth.onAuthStateChange((_evento, sess) => {
    const novo = sess?.user ?? null;
    if ((novo?.id ?? null) !== (state.user?.id ?? null)) {
      state.user = novo; state.perfil = null; state.cats = null;
      setTimeout(route, 0); // evita chamar o Supabase dentro do callback
    }
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
